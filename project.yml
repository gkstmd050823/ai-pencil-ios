# XcodeGen spec. The Xcode project is generated from this on the build server (xcodegen generate),
# so no Mac is needed to create or edit it.
name: AIPencil
options:
  deploymentTarget:
    iOS: "17.5"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.7.1"
    CURRENT_PROJECT_VERSION: "8"
    SWIFT_VERSION: "5.0"
targets:
  AIPencil:
    type: application
    platform: iOS
    sources:
      - path: AIPencil
        excludes:
          - "Web/**"
      # The pages shown in web views (formula preview, explanations) with KaTeX, marked and the fonts go
      # into the app as a folder, kept whole: the stylesheet finds the fonts by relative path.
      - path: AIPencil/Web
        type: folder
    info:
      path: AIPencil/Info.plist
      properties:
        CFBundleDisplayName: AI 펜슬
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # An (empty) launch screen is what tells iPadOS the app fills the screen and can be resized.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets "open in" and the share sheet hand a PDF to the app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: true
        ITSAppUsesNonExemptEncryption: false
        # Plain HTTP only to this machine or the local network: a debug build can be pointed at the
        # stand-in server in tools/. A release build only ever talks to api.anthropic.com, over HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aipencil.ios
        # iPad only. Set on the target: XcodeGen's own target defaults would override a project-wide value.
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
