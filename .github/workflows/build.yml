# Builds the iPad app on a macOS runner, since there is no Mac to build it on.
#
# What comes out (Actions > the run > Artifacts):
#   AIPencil-ipa      an unsigned IPA. Sideloadly on Windows signs it with your Apple ID and installs it.
#   screenshots       the app running in an iPad simulator, to see what a change looks like; with them what
#                     the stand-in Claude server received (mock.log, the pictures in mock-dump) and the app's
#                     own notes (app-debug.log).
#   logs              the full build logs, when something went wrong.
name: iPad build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tools on this runner
        run: |
          xcodebuild -version
          swift --version

      - name: Generate the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      # First for the simulator: it is the quicker build, so a compile error shows up sooner.
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project AIPencil.xcodeproj -scheme AIPencil \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-simulator.log | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-simulator.log

      - name: Run it in an iPad simulator and take pictures
        run: |
          set -e
          mkdir -p screenshots
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          found = ""
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if "iPad" in d["name"]:
                      found = d["udid"]
          print(found)')
          if [ -z "$UDID" ]; then echo "no iPad simulator on this runner"; xcrun simctl list devices available; exit 0; fi
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/AIPencil.app
          # Each launch asks the app to do something no one is there to tap, then a picture is taken.
          shot() {
            name="$1"; wait="$2"; shift 2
            xcrun simctl launch --terminate-running-process "$UDID" app.aipencil.ios "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          shot 1-shelf-empty 12
          shot 2-reader 12 -sample -demoInk
          shot 3-formula 16 -sample -demoInk -demoMath
          shot 4-blank-page-added 12 -sample -demoAddPage
          shot 5-new-note 10 -demoNote
          shot 6-shelf 8

          # The AI pen. Without a key and without the stand-in server it can only say that a key is needed.
          shot 7-ask-no-key 12 -sample -demoAsk
          # A stand-in for the Claude API on this machine, so the rest can be tried without a key. It
          # prints what the app sent and keeps the pictures that came with each question.
          python3 tools/mock_claude.py --host 127.0.0.1 --port 8787 --dump mock-dump --delay 0.004 --think 0.3 > mock.log 2>&1 &
          MOCK=$!
          API="-apiBase http://127.0.0.1:8787"
          shot 8-ask 16 -sample -demoAsk $API
          shot 9-follow-up 20 -sample -demoAsk -demoAskX 300 -demoAskY 330 -demoFollowUp $API
          shot 10-marks-reloaded 10 -sample
          shot 11-marks-hidden 10 -sample -showAiMarks NO
          shot 12-question-list 10 -sample -demoQuestions
          shot 13-wide 16 -sample -demoAsk -demoAskX 380 -demoAskY 520 -demoWide YES $API
          # Pages that are turned or cropped: the mark in the pictures sent has to sit where it sits on screen.
          DATA=$(xcrun simctl get_app_container "$UDID" app.aipencil.ios data)
          mkdir -p "$DATA/Documents"
          cp tools/tricky.pdf "$DATA/Documents/tricky.pdf"
          # (The ring goes round the heading: the same place in every turned page's own frame.)
          shot 14-ask-turned-90 18 -demoImport tricky.pdf -demoPage 1 -demoAsk $API
          shot 14-ask-turned-270 18 -demoImport tricky.pdf -demoPage 2 -demoAsk $API
          shot 14-ask-turned-180 18 -demoImport tricky.pdf -demoPage 3 -demoAsk $API
          shot 15-ask-cropped-page 18 -demoImport tricky.pdf -demoPage 4 -demoAsk -demoAskX 100 -demoAskY 36 $API
          shot 16-settings 8 -demoSettings
          xcrun simctl ui "$UDID" appearance dark
          shot 17-dark 12 -sample -demoOpenQuestion
          xcrun simctl ui "$UDID" appearance light
          kill $MOCK || true
          cp "$DATA/Documents/debug.log" app-debug.log 2>/dev/null || true
          echo "---- what the stand-in server received ----"
          cat mock.log || true
          echo "---- the app's own notes ----"
          cat app-debug.log || true
          xcrun simctl shutdown "$UDID" || true

      - name: Build for the iPad (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AIPencil.xcodeproj -scheme AIPencil \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build-device.log | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-device.log

      - name: Package the IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AIPencil.app Payload/
          zip -qry AIPencil.ipa Payload
          ls -la AIPencil.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AIPencil-ipa
          path: AIPencil.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            screenshots
            mock-dump
            mock.log
            app-debug.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 14
