# Builds the iPad app on a macOS runner, since there is no Mac to build it on.
#
# What comes out (Actions > the run > Artifacts):
#   AIPencil-ipa      an unsigned IPA. Sideloadly on Windows signs it with your Apple ID and installs it.
#   screenshots       the app running in an iPad simulator, to see what a change looks like; with them what
#                     the stand-in Claude server received (mock.log, the pictures in mock-dump) and the app's
#                     own notes (app-debug.log).
#   logs              the full build logs, when something went wrong.
name: iPad build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Tools on this runner
        run: |
          xcodebuild -version
          swift --version

      - name: Generate the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      # First for the simulator: it is the quicker build, so a compile error shows up sooner.
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project AIPencil.xcodeproj -scheme AIPencil \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-simulator.log | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-simulator.log

      - name: Run it in an iPad simulator and take pictures
        run: |
          set -e
          mkdir -p screenshots
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          found = ""
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if "iPad" in d["name"]:
                      found = d["udid"]
          print(found)')
          if [ -z "$UDID" ]; then echo "no iPad simulator on this runner"; xcrun simctl list devices available; exit 0; fi
          echo "$UDID" > udid.txt
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/AIPencil.app
          # Each launch asks the app to do something no one is there to tap, then a picture is taken.
          shot() {
            name="$1"; wait="$2"; shift 2
            xcrun simctl launch --terminate-running-process "$UDID" app.aipencil.ios "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          shot 1-shelf-empty 12
          shot 2-reader 12 -sample -demoInk
          # Zoomed in well past fitting the page: the ink has to stay sharp, and so has the page.
          shot 2-reader-zoomed 14 -sample -demoInk -demoZoom 2.5
          # The same two as PDFKit alone draws the page, to set beside the app's own picture of it; then
          # both ways zoomed in much further, and both ways on a page that is one scanned picture.
          shot 2-reader-soft 12 -sample -demoInk -sharpPages NO
          shot 2-reader-zoomed-soft 14 -sample -demoInk -demoZoom 2.5 -sharpPages NO
          shot 2-reader-zoom6 14 -sample -demoInk -demoZoom 6
          shot 2-reader-zoom6-soft 14 -sample -demoInk -demoZoom 6 -sharpPages NO
          shot 2-reader-zoom12 14 -sample -demoInk -demoZoom 12
          shot 2-reader-zoom12-soft 14 -sample -demoInk -demoZoom 12 -sharpPages NO
          DATA=$(xcrun simctl get_app_container "$UDID" app.aipencil.ios data)
          mkdir -p "$DATA/Documents"
          cp tools/scan.pdf "$DATA/Documents/scan.pdf"
          shot 29-scan 12 -demoImport scan.pdf
          shot 29-scan-soft 12 -demoImport scan.pdf -sharpPages NO
          shot 29-scan-zoomed 14 -demoImport scan.pdf -demoZoom 2.5
          shot 29-scan-zoomed-soft 14 -demoImport scan.pdf -demoZoom 2.5 -sharpPages NO
          # Pages much larger than the screen, which PDFKit has to draw smaller than their own size.
          cp tools/big.pdf tools/mid.pdf "$DATA/Documents/"
          shot 29-big 12 -demoImport big.pdf
          shot 29-big-soft 12 -demoImport big.pdf -sharpPages NO
          shot 29-mid 12 -demoImport mid.pdf
          shot 29-mid-soft 12 -demoImport mid.pdf -sharpPages NO
          xcrun simctl ui "$UDID" appearance dark
          shot 29-scan-dark 12 -demoImport scan.pdf
          shot 29-scan-dark-soft 12 -demoImport scan.pdf -sharpPages NO
          xcrun simctl ui "$UDID" appearance light
          shot 3-formula 16 -sample -demoInk -demoMath
          shot 4-blank-page-added 12 -sample -demoAddPage
          shot 5-new-note 10 -demoNote
          shot 5-paper-sheet 8 -demoPapers
          shot 5-new-note-lined 10 -demoNote -demoPaper lined
          shot 5-new-note-cornell 10 -demoNote -demoPaper cornell
          shot 6-shelf 8

          # The AI pen. Without a key and without the stand-in server it can only say that a key is needed.
          shot 7-ask-no-key 12 -sample -demoAsk
          # A stand-in for the Claude API on this machine, so the rest can be tried without a key. It
          # prints what the app sent and keeps the pictures that came with each question.
          python3 tools/mock_claude.py --host 127.0.0.1 --port 8787 --dump mock-dump --delay 0.004 --think 0.3 --search 1.5 > mock.log 2>&1 &
          MOCK=$!
          # (Given a moment to start listening: the first question once went out before it did.)
          sleep 3
          API="-apiBase http://127.0.0.1:8787"
          shot 8-ask 16 -sample -demoAsk $API
          shot 9-follow-up 20 -sample -demoAsk -demoAskX 300 -demoAskY 330 -demoFollowUp $API
          shot 10-marks-reloaded 10 -sample
          shot 11-marks-hidden 10 -sample -showAiMarks NO
          shot 12-question-list 10 -sample -demoQuestions
          shot 13-wide 16 -sample -demoAsk -demoAskX 380 -demoAskY 520 -demoWide YES $API
          # The eraser drawn through the ring round the heading: the ring goes, its question stays in the list.
          shot 28-erase-mark 9 -sample -demoTool eraser -demoEraseMark
          shot 28-question-list-after 10 -sample -demoQuestions
          # Pages that are turned or cropped: the mark in the pictures sent has to sit where it sits on screen.
          DATA=$(xcrun simctl get_app_container "$UDID" app.aipencil.ios data)
          mkdir -p "$DATA/Documents"
          cp tools/tricky.pdf "$DATA/Documents/tricky.pdf"
          # (The ring goes round the heading: the same place in every turned page's own frame.)
          shot 14-ask-turned-90 18 -demoImport tricky.pdf -demoPage 1 -demoAsk $API
          shot 14-ask-turned-270 18 -demoImport tricky.pdf -demoPage 2 -demoAsk $API
          shot 14-ask-turned-180 18 -demoImport tricky.pdf -demoPage 3 -demoAsk $API
          shot 15-ask-cropped-page 18 -demoImport tricky.pdf -demoPage 4 -demoAsk -demoAskX 100 -demoAskY 36 $API
          # A follow-up that asks for the web: the stand-in answers with a search, a result and words that
          # cite it. Asking once more shows whether all of that goes back to the API as it came.
          shot 18-web-search 24 -sample -demoAsk -demoAskX 300 -demoAskY 600 -demoFollowUp -demoFollowUpText "웹에서 검색해서 알려줘" $API
          shot 19-web-search-again 20 -sample -demoOpenQuestion -demoFollowUp -demoFollowUpText "왜 그런가요" $API
          shot 20-tool-options 10 -sample -demoOptions
          # The bar must be the same size and in the same place whatever tool is in hand.
          shot 20-tool-eraser 8 -sample -demoTool eraser
          shot 20-tool-lasso 8 -sample -demoTool lasso
          shot 20-tool-ai 8 -sample -demoTool ai
          shot 20-eraser-options 10 -sample -demoTool eraser -demoOptions
          shot 20-highlighter-options 10 -sample -demoTool highlighter -demoOptions
          shot 20-shapes 12 -sample -demoShapes
          # A dotted page added after the first page, and shapes drawn on it: an added page with writing on it.
          shot 20-added-dots 12 -sample -demoAddPage -demoPaper dots
          shot 20-added-dots-shapes 12 -sample -demoPage 1 -demoShapes
          shot 21-pages 10 -sample -demoBookmark -demoNavigator pages
          shot 21-bookmarks 10 -sample -demoNavigator bookmarks
          shot 21-search 10 -sample -demoNavigator search -demoSearch 손실
          shot 21-outline 10 -sample -demoNavigator outline
          # The words a search found, marked on the page itself.
          shot 21-search-hit 10 -sample -demoFind 손실
          shot 22-two-up 10 -sample -pageLayout twoUp
          shot 23-paged 12 -sample -pageLayout paged
          shot 23-paged-ask 18 -sample -pageLayout paged -demoAsk -demoAskX 300 -demoAskY 200 $API
          # A formula typed on a page that is shown turned has to stand upright.
          shot 24-formula-turned 16 -demoImport tricky.pdf -demoPage 1 -demoMath
          # Exports: the file itself with the writing added at its end. Each is kept, and its pages are turned
          # into pictures and their first words printed, to see that it looks right and still reads right.
          exported() {
            cp "$DATA/Documents/export.pdf" "$1.pdf" 2>/dev/null || true
            rm -f "$DATA/Documents/export.pdf"
            swift tools/pdf_pages.swift "$1.pdf" "screenshots/26-$1" 8 || true
          }
          shot 26-export 14 -sample -demoExport
          exported export
          # A document with pages that are shown turned.
          shot 26-export-turned 14 -demoImport tricky.pdf -demoExport
          exported export-turned
          # A file put together the newer way (object streams, a cross-reference stream), with a ring on it.
          cp tools/packed.pdf "$DATA/Documents/packed.pdf"
          shot 26-packed-ask 18 -demoImport packed.pdf -demoAsk $API
          shot 26-export-packed 14 -demoImport packed.pdf -demoExport
          exported export-packed
          # A file that opens without a password but is encrypted against changes, as handouts often are. It
          # cannot be added to, so this is the other way out: PDFKit writes the document anew.
          cp tools/locked.pdf "$DATA/Documents/locked.pdf"
          shot 26-locked-ask 18 -demoImport locked.pdf -demoAsk $API
          shot 26-export-locked 14 -demoImport locked.pdf -demoExport
          exported export-locked
          # A ruled notebook with a page added: the first page's lines are the file's, the second's the export's.
          shot 26-export-note 14 -demoNote -demoPaper lined -demoAddPage -demoExport
          exported export-note
          shot 27-shelf-folders 8 -demoShelf
          shot 16-settings 8 -demoSettings
          xcrun simctl ui "$UDID" appearance dark
          shot 17-dark 12 -sample -demoOpenQuestion
          # A page added in the app has to turn into dark paper like the file's own pages.
          shot 17-dark-added-page 10 -sample -demoPage 1
          shot 17-dark-white-paper 10 -sample -darkPaper NO
          shot 17-dark-shelf 8
          xcrun simctl ui "$UDID" appearance light
          kill $MOCK || true
          # The home screen, for the app's icon.
          xcrun simctl terminate "$UDID" app.aipencil.ios || true
          sleep 3
          xcrun simctl io "$UDID" screenshot screenshots/25-home.png || true
          cp "$DATA/Documents/debug.log" app-debug.log 2>/dev/null || true
          echo "---- what the stand-in server received ----"
          cat mock.log || true
          echo "---- the app's own notes ----"
          cat app-debug.log || true
          xcrun simctl shutdown "$UDID" || true

      - name: Build for the iPad (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AIPencil.xcodeproj -scheme AIPencil \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build-device.log | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-device.log

      - name: Package the IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AIPencil.app Payload/
          zip -qry AIPencil.ipa Payload
          ls -la AIPencil.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AIPencil-ipa
          path: AIPencil.ipa
          retention-days: 30

      # Real touches: a finger writes, rubs out and draws in the simulator (AIPencilUITests). What it leaves
      # is pictures and the app's notes; a failure here does not fail the build, the IPA is made already.
      - name: Touch the pages with a finger
        continue-on-error: true
        run: |
          UDID=$(cat udid.txt 2>/dev/null || true)
          if [ -z "$UDID" ]; then echo "no simulator to test on"; exit 0; fi
          mkdir -p screenshots
          xcodegen generate --spec uitests.yml
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          python3 tools/mock_claude.py --host 127.0.0.1 --port 8787 --delay 0.004 --think 0.3 --search 1.5 > mock-touch.log 2>&1 &
          MOCK=$!
          sleep 3
          export TEST_RUNNER_SHOTS="$PWD/screenshots"
          xcodebuild test \
            -project AIPencilTests.xcodeproj -scheme Touch \
            -destination "id=$UDID" \
            -derivedDataPath build-tests 2>&1 | tee touch-test.log | grep -E "error:|Test Case|Test Suite|Executed|\*\* TEST" || true
          kill $MOCK || true
          DATA=$(xcrun simctl get_app_container "$UDID" app.aipencil.ios data || true)
          if [ -n "$DATA" ]; then cp "$DATA/Documents/debug.log" touch-debug.log 2>/dev/null || true; fi
          echo "---- the app's own notes during the touch test ----"
          grep -E "eraser:|tool:|undo:" touch-debug.log || true
          ls screenshots | grep touch || echo "no pictures came out of the touch test"
          xcrun simctl shutdown "$UDID" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            screenshots
            mock-dump
            mock.log
            app-debug.log
            touch-test.log
            touch-debug.log
            export.pdf
            export-turned.pdf
            export-packed.pdf
            export-locked.pdf
            export-note.pdf
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 14
